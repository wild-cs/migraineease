name: Android app

# Builds the Android APK, tests it on an emulator, and publishes it as a GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.MIGRAINEEASE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Secret MIGRAINEEASE_KEYSTORE_B64 is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build APKs
        env:
          MIGRAINEEASE_KEYSTORE: ${{ runner.temp }}/release.p12
          MIGRAINEEASE_KEYSTORE_PASSWORD: ${{ secrets.MIGRAINEEASE_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleDebug assembleRelease --no-daemon

      - name: Check release signature
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          ls -l android/app/build/outputs/apk/*/*.apk

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash android/test/run-emulator-test.sh android/app/build/outputs/apk/debug/app-debug.apk test-output

      - name: Keep test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test
          path: test-output
          if-no-files-found: ignore

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MigraineEase.apk
          gh release create "android-${{ github.run_number }}" MigraineEase.apk \
            --title "MigraineEase for Android (build ${{ github.run_number }})" \
            --latest \
            --notes "Download **MigraineEase.apk** below on your Android phone and open it to install. Android will ask you to allow installing apps from your browser or Files app; allow it once.

          To update later, install a newer APK over the old one: your data is kept. Uninstalling the app deletes its data, so make a backup first (Profile → Back up)."
